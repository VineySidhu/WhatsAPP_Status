<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7c2d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bhakti Status Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fffbf5;
      -webkit-tap-highlight-color: transparent;
    }
    .font-devotional {
      font-family: 'Cinzel', serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen text-stone-800 pb-20">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-gradient-to-r from-orange-800 via-amber-800 to-red-900 text-white shadow-md">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🪔</span>
        <div>
          <h1 class="font-devotional font-bold text-lg tracking-wide leading-tight">Bhakti Status</h1>
          <p class="text-[11px] text-amber-200 leading-none">HD Devotional WhatsApp Status</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="refreshBtn" onclick="forceReloadPhotos()" title="Load fresh photos" class="text-xs bg-white/15 hover:bg-white/25 active:scale-95 transition px-3.5 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
          <span>🔄</span> New Photos
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-4 space-y-5">

    <!-- Profile Card (Persistent in localStorage) -->
    <section class="bg-white rounded-2xl shadow-sm border border-amber-200/80 overflow-hidden">
      <!-- Compact Summary View -->
      <div id="profileSummary" class="hidden p-3.5 flex items-center justify-between bg-gradient-to-r from-amber-50 to-orange-50">
        <div class="flex items-center gap-3 min-w-0">
          <img id="summaryAvatar" src="" alt="Profile" class="w-12 h-12 rounded-full object-cover border-2 border-amber-500 shadow-sm shrink-0 bg-amber-100" />
          <div class="min-w-0">
            <p class="text-[11px] font-semibold uppercase tracking-wider text-amber-700">Your Status Stamp</p>
            <p id="summaryName" class="font-bold text-stone-900 truncate text-base"></p>
            <p id="summarySubtitle" class="text-xs text-stone-600 truncate"></p>
          </div>
        </div>
        <button onclick="toggleProfileEdit(true)" class="shrink-0 bg-white border border-amber-300 text-amber-900 hover:bg-amber-100 px-3.5 py-2 rounded-xl text-xs font-bold shadow-xs">
          Edit Name / Photo
        </button>
      </div>

      <!-- Editable Profile Form -->
      <div id="profileEditor" class="p-4 space-y-3.5">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-base text-amber-950 flex items-center gap-1.5">
            <span>🙏</span> Your Name & Photo (Saved Automatically)
          </h2>
          <button id="cancelEditBtn" onclick="toggleProfileEdit(false)" class="hidden text-xs text-stone-500 underline">Done</button>
        </div>

        <div class="flex items-center gap-4">
          <label class="relative cursor-pointer group shrink-0">
            <div id="avatarPreviewBox" class="w-20 h-20 rounded-full bg-amber-100 border-2 border-dashed border-amber-500 flex flex-col items-center justify-center overflow-hidden shadow-inner">
              <img id="editorAvatarImg" src="" class="hidden w-full h-full object-cover" />
              <div id="avatarPlaceholder" class="text-center p-1">
                <span class="text-xl block">📷</span>
                <span class="text-[10px] font-bold text-amber-900 leading-tight block">Add Photo</span>
              </div>
            </div>
            <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handleProfilePhotoUpload(event)" />
          </label>

          <div class="flex-1 space-y-2.5">
            <div>
              <label class="block text-xs font-semibold text-stone-600 mb-1">Your Name</label>
              <input id="nameInput" type="text" placeholder="Enter your name..." oninput="saveProfileFromInputs()" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-amber-600 focus:ring-2 focus:ring-amber-200 outline-none text-base font-semibold bg-amber-50/30" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-stone-600 mb-1">Blessing Line</label>
              <input id="subtitleInput" type="text" placeholder="e.g. Jai Shri Ram • Suprabhat" oninput="saveProfileFromInputs()" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-amber-600 focus:ring-2 focus:ring-amber-200 outline-none text-sm bg-amber-50/30" />
            </div>
          </div>
        </div>

        <div class="flex justify-end pt-1">
          <button onclick="saveAndCollapseProfile()" class="w-full sm:w-auto bg-amber-700 hover:bg-amber-800 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-sm active:scale-98 transition">
            Save My Name & Photo ✓
          </button>
        </div>
      </div>
    </section>

    <!-- Category Pills -->
    <section class="space-y-2.5">
      <div class="flex items-center justify-between">
        <span id="todayBadge" class="text-xs font-bold text-orange-800 bg-orange-100 border border-orange-200 px-3 py-1 rounded-full"></span>
        <label class="cursor-pointer text-xs font-bold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 px-3 py-1 rounded-full flex items-center gap-1">
          <span>🖼️ Own God Photo</span>
          <input type="file" accept="image/*" class="hidden" onchange="handleCustomBgUpload(event)" />
        </label>
      </div>

      <div id="categoryBar" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        <!-- Populated by JS -->
      </div>

      <!-- Search Box -->
      <form onsubmit="handleSearchSubmit(event)" class="flex gap-2">
        <input id="searchInput" type="text" placeholder="Search any God or festival (e.g. Hanuman, Durga, Shiva, Diwali)..." class="flex-1 px-3.5 py-2.5 rounded-xl border border-amber-200 bg-white text-sm focus:border-amber-600 outline-none shadow-2xs" />
        <button type="submit" class="bg-amber-700 hover:bg-amber-800 text-white font-bold text-sm px-4 py-2.5 rounded-xl shadow-2xs active:scale-95 transition">
          Search
        </button>
      </form>
    </section>

    <!-- Status Banner -->
    <div id="statusBanner" class="hidden text-center text-xs font-medium text-amber-900 bg-amber-100/80 border border-amber-200 rounded-xl py-2 px-3"></div>

    <!-- Feed Grid -->
    <section id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <!-- Cards injected here -->
    </section>

    <!-- Load More Button -->
    <div class="text-center pt-2 pb-6">
      <button id="loadMoreBtn" onclick="loadMorePhotos()" class="bg-white hover:bg-amber-50 text-amber-900 border-2 border-amber-400 font-bold text-sm px-6 py-3 rounded-2xl shadow-sm active:scale-95 transition">
        ✨ Show More HD Photos
      </button>
    </div>
  </main>

  <script>
    // ==========================================
    // 1. PRE-CONFIGURED PIXABAY HD ENGINE & DEITIES
    // ==========================================
    const DEFAULT_PIXABAY_KEY = '58610013-08576450dab30642fdaf5da97';

    const CATEGORIES = [
      {
        id: 'today',
        label: "✨ Today's Special",
        pixabayQueries: [],
        wmCategories: [],
        subtitle: 'Subh Prabhat • God Bless You'
      },
      {
        id: 'hanuman',
        label: '🚩 Hanuman Ji',
        pixabayQueries: ['Hanuman', 'Lord Hanuman', 'Hindu temple god'],
        wmCategories: ['Category:Paintings_of_Hanuman'],
        subtitle: 'Jai Shri Ram • Jai Bajrangbali'
      },
      {
        id: 'mata',
        label: '🌺 Mata Rani',
        pixabayQueries: ['Durga', 'Goddess Durga', 'Lakshmi', 'Navratri'],
        wmCategories: ['Category:Paintings_of_Durga', 'Category:Paintings_of_Lakshmi'],
        subtitle: 'Jai Mata Di • Subh Navratri'
      },
      {
        id: 'shiv',
        label: '🔱 Shiv Ji',
        pixabayQueries: ['Shiva', 'Lord Shiva', 'Mahadev'],
        wmCategories: ['Category:Paintings_of_Shiva'],
        subtitle: 'Har Har Mahadev • Om Namah Shivaya'
      },
      {
        id: 'ganesh',
        label: '🐘 Ganesh Ji',
        pixabayQueries: ['Ganesha', 'Lord Ganesha', 'Ganpati'],
        wmCategories: ['Category:Paintings_of_Ganesha'],
        subtitle: 'Ganpati Bappa Morya • Shubh Labh'
      },
      {
        id: 'krishna',
        label: '🦚 Krishna Ji',
        pixabayQueries: ['Krishna', 'Radha Krishna', 'Lord Krishna'],
        wmCategories: ['Category:Paintings_of_Krishna'],
        subtitle: 'Jai Shri Krishna • Radhe Radhe'
      },
      {
        id: 'guru',
        label: '☬ Waheguru Ji',
        pixabayQueries: ['Golden Temple Amritsar', 'Sikh temple', 'Guru Nanak'],
        wmCategories: ['Category:Harmandir_Sahib', 'Category:Paintings_of_Guru_Nanak'],
        subtitle: 'Satnam Sri Waheguru Ji'
      },
      {
        id: 'surya',
        label: '☀️ Morning Blessings',
        pixabayQueries: ['Diwali diya', 'Hindu temple sunrise', 'Lotus flower sunrise'],
        wmCategories: ['Category:Diwali'],
        subtitle: 'Suprabhat • Have a Blessed Day'
      }
    ];

    const DAY_MAP = {
      0: { catId: 'surya', dayName: 'Sunday (Surya Dev)' },
      1: { catId: 'shiv', dayName: 'Monday (Somwar - Shiv Ji)' },
      2: { catId: 'hanuman', dayName: 'Tuesday (Mangalwar - Hanuman Ji)' },
      3: { catId: 'ganesh', dayName: 'Wednesday (Budhwar - Ganesh Ji)' },
      4: { catId: 'krishna', dayName: 'Thursday (Guruwar - Vishnu / Krishna)' },
      5: { catId: 'mata', dayName: 'Friday (Shukrawar - Mata Rani)' },
      6: { catId: 'hanuman', dayName: 'Saturday (Shaniwar - Hanuman Ji)' }
    };

    let state = {
      name: '',
      subtitle: '',
      avatarDataUrl: '',
      activeCategory: 'today',
      customSearchQuery: '',
      page: 1,
      photos: []
    };

    // ==========================================
    // 2. INITIALIZATION & PROFILE PERSISTENCE
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedProfile();
      applyUrlParameters();
      setupDayBadge();
      renderCategoryBar();
      updateProfileUI();
      fetchPhotos(true);
    });

    function loadSavedProfile() {
      try {
        state.name = localStorage.getItem('bhakti_name') || '';
        state.subtitle = localStorage.getItem('bhakti_subtitle') || '';
        state.avatarDataUrl = localStorage.getItem('bhakti_avatar') || '';
      } catch (e) {}
    }

    function applyUrlParameters() {
      const params = new URLSearchParams(window.location.search);
      const urlName = params.get('name');
      const urlSub = params.get('subtitle');
      if (urlName) {
        state.name = urlName.trim();
        try { localStorage.setItem('bhakti_name', state.name); } catch (e) {}
      }
      if (urlSub) {
        state.subtitle = urlSub.trim();
        try { localStorage.setItem('bhakti_subtitle', state.subtitle); } catch (e) {}
      }
    }

    function updateProfileUI() {
      document.getElementById('nameInput').value = state.name;
      document.getElementById('subtitleInput').value = state.subtitle;

      const summary = document.getElementById('profileSummary');
      const editor = document.getElementById('profileEditor');
      const cancelBtn = document.getElementById('cancelEditBtn');

      if (state.avatarDataUrl) {
        document.getElementById('editorAvatarImg').src = state.avatarDataUrl;
        document.getElementById('editorAvatarImg').classList.remove('hidden');
        document.getElementById('avatarPlaceholder').classList.add('hidden');
        document.getElementById('summaryAvatar').src = state.avatarDataUrl;
      } else {
        document.getElementById('editorAvatarImg').classList.add('hidden');
        document.getElementById('avatarPlaceholder').classList.remove('hidden');
        document.getElementById('summaryAvatar').src = createDefaultAvatarDataUrl();
      }

      if (state.name) {
        document.getElementById('summaryName').textContent = state.name;
        document.getElementById('summarySubtitle').textContent = state.subtitle || getActiveCategoryObj().subtitle;
        summary.classList.remove('hidden');
        editor.classList.add('hidden');
        cancelBtn.classList.remove('hidden');
      } else {
        summary.classList.add('hidden');
        editor.classList.remove('hidden');
        cancelBtn.classList.add('hidden');
      }
    }

    function toggleProfileEdit(showEditor) {
      const summary = document.getElementById('profileSummary');
      const editor = document.getElementById('profileEditor');
      if (showEditor) {
        summary.classList.add('hidden');
        editor.classList.remove('hidden');
      } else if (state.name) {
        summary.classList.remove('hidden');
        editor.classList.add('hidden');
      }
    }

    function saveProfileFromInputs() {
      state.name = document.getElementById('nameInput').value.trim();
      state.subtitle = document.getElementById('subtitleInput').value.trim();
      try {
        localStorage.setItem('bhakti_name', state.name);
        localStorage.setItem('bhakti_subtitle', state.subtitle);
      } catch (e) {}
      redrawAllCanvases();
    }

    function saveAndCollapseProfile() {
      saveProfileFromInputs();
      updateProfileUI();
      redrawAllCanvases();
    }

    function handleProfilePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 360;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          state.avatarDataUrl = canvas.toDataURL('image/jpeg', 0.9);
          try {
            localStorage.setItem('bhakti_avatar', state.avatarDataUrl);
          } catch (err) {}
          updateProfileUI();
          redrawAllCanvases();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function createDefaultAvatarDataUrl() {
      const c = document.createElement('canvas');
      c.width = 120;
      c.height = 120;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, 120, 120);
      ctx.font = '56px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🙏', 60, 64);
      return c.toDataURL();
    }

    // ==========================================
    // 3. CATEGORIES & DAY-OF-WEEK LOGIC
    // ==========================================
    function setupDayBadge() {
      const today = new Date().getDay();
      const info = DAY_MAP[today] || DAY_MAP[2];
      document.getElementById('todayBadge').textContent = `Today: ${info.dayName}`;
    }

    function getActiveCategoryObj() {
      if (state.activeCategory === 'today') {
        const today = new Date().getDay();
        const mappedId = (DAY_MAP[today] || DAY_MAP[2]).catId;
        return CATEGORIES.find(c => c.id === mappedId) || CATEGORIES[1];
      }
      return CATEGORIES.find(c => c.id === state.activeCategory) || CATEGORIES[1];
    }

    function renderCategoryBar() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const isActive = state.activeCategory === cat.id && !state.customSearchQuery;
        const btn = document.createElement('button');
        btn.className = isActive
          ? 'shrink-0 px-4 py-2 rounded-full text-xs font-bold bg-amber-800 text-white shadow-sm transition'
          : 'shrink-0 px-4 py-2 rounded-full text-xs font-semibold bg-white text-stone-700 border border-amber-200 hover:bg-amber-50 transition';
        btn.textContent = cat.label;
        btn.onclick = () => {
          state.activeCategory = cat.id;
          state.customSearchQuery = '';
          state.page = 1;
          document.getElementById('searchInput').value = '';
          renderCategoryBar();
          fetchPhotos(true);
        };
        bar.appendChild(btn);
      });
    }

    function handleSearchSubmit(e) {
      e.preventDefault();
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      state.customSearchQuery = q;
      state.page = 1;
      renderCategoryBar();
      fetchPhotos(true);
    }

    function forceReloadPhotos() {
      state.page += 1;
      fetchPhotos(true);
    }

    function loadMorePhotos() {
      state.page += 1;
      fetchPhotos(false);
    }

    // ==========================================
    // 4. HD IMAGE FETCH ENGINE (PIXABAY + FALLBACK)
    // ==========================================
    function showBanner(msg) {
      const el = document.getElementById('statusBanner');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideBanner() {
      document.getElementById('statusBanner').classList.add('hidden');
    }

    async function fetchPhotos(reset = true) {
      const container = document.getElementById('cardsContainer');
      if (reset) {
        state.photos = [];
        container.innerHTML = '';
        showBanner('Loading HD devotional artwork...');
      } else {
        showBanner('Loading more HD photos...');
      }

      const catObj = getActiveCategoryObj();
      const queries = state.customSearchQuery
        ? [state.customSearchQuery, `${state.customSearchQuery} Hindu`]
        : catObj.pixabayQueries;

      let fetched = [];

      // 1. Query Pixabay with vertical orientation first (best fit for 9:16 WhatsApp Status)
      for (let i = 0; i < queries.length && fetched.length < 6; i++) {
        try {
          const verticalHits = await queryPixabay(queries[i], state.page, 'vertical');
          verticalHits.forEach(item => {
            if (!fetched.some(x => x.url === item.url)) fetched.push(item);
          });
        } catch (err) {}
      }

      // 2. If fewer than 6 vertical images exist for that deity, include all orientations (square/landscape center-cropped cleanly)
      for (let i = 0; i < queries.length && fetched.length < 6; i++) {
        try {
          const anyHits = await queryPixabay(queries[i], state.page, 'all');
          anyHits.forEach(item => {
            if (!fetched.some(x => x.url === item.url)) fetched.push(item);
          });
        } catch (err) {}
      }

      // 3. Secondary fallback: High-res Wikimedia paintings only if Pixabay returned < 4 results
      if (fetched.length < 4 && catObj.wmCategories) {
        for (const wmCat of catObj.wmCategories) {
          if (fetched.length >= 6) break;
          try {
            const wmItems = await queryWikimediaCategory(wmCat);
            wmItems.forEach(item => {
              if (!fetched.some(x => x.url === item.url)) fetched.push(item);
            });
          } catch (err) {}
        }
      }

      // 4. Built-in artistic fallback if completely offline
      if (fetched.length === 0 && reset) {
        fetched = buildFallbackTemplates(catObj);
        showBanner('Showing built-in devotional cards (offline mode).');
      } else {
        hideBanner();
      }

      const sliceToRender = fetched.slice(0, 6);
      const startIndex = state.photos.length;
      state.photos = state.photos.concat(sliceToRender);
      sliceToRender.forEach((photo, idx) => {
        renderPhotoCard(photo, startIndex + idx);
      });
    }

    async function queryPixabay(searchTerm, page = 1, orientation = 'vertical') {
      const endpoint = new URL('https://pixabay.com/api/');
      endpoint.searchParams.set('key', DEFAULT_PIXABAY_KEY);
      endpoint.searchParams.set('q', searchTerm);
      endpoint.searchParams.set('image_type', 'all');
      endpoint.searchParams.set('orientation', orientation);
      endpoint.searchParams.set('safesearch', 'true');
      endpoint.searchParams.set('order', 'popular');
      endpoint.searchParams.set('per_page', '12');
      endpoint.searchParams.set('page', String(page));

      const res = await fetch(endpoint.toString());
      if (!res.ok) return [];
      const data = await res.json();
      if (!data.hits) return [];

      return data.hits.map(hit => {
        const rawTag = (hit.tags || searchTerm).split(',')[0].trim();
        const niceTitle = rawTag.charAt(0).toUpperCase() + rawTag.slice(1);
        return {
          url: hit.largeImageURL || hit.webformatURL,
          fallbackUrl: hit.webformatURL,
          title: niceTitle,
          source: 'HD Art',
          isFallback: false
        };
      });
    }

    async function queryWikimediaCategory(categoryTitle) {
      const endpoint = new URL('https://commons.wikimedia.org/w/api.php');
      endpoint.searchParams.set('action', 'query');
      endpoint.searchParams.set('format', 'json');
      endpoint.searchParams.set('origin', '*');
      endpoint.searchParams.set('generator', 'categorymembers');
      endpoint.searchParams.set('gcmtitle', categoryTitle);
      endpoint.searchParams.set('gcmtype', 'file');
      endpoint.searchParams.set('gcmlimit', '15');
      endpoint.searchParams.set('prop', 'imageinfo');
      endpoint.searchParams.set('iiprop', 'url|size|mime');
      endpoint.searchParams.set('iiurlwidth', '1080');

      const res = await fetch(endpoint.toString());
      if (!res.ok) return [];
      const data = await res.json();
      if (!data.query || !data.query.pages) return [];

      const out = [];
      Object.values(data.query.pages).forEach(page => {
        const info = page.imageinfo && page.imageinfo[0];
        if (!info) return;
        const mime = (info.mime || '').toLowerCase();
        if (!mime.includes('jpeg') && !mime.includes('jpg') && !mime.includes('png')) return;
        if ((info.width || 0) < 600 || (info.height || 0) < 600) return;

        const cleanTitle = (page.title || '')
          .replace(/^File:/i, '')
          .replace(/\.[^.]+$/, '')
          .replace(/[_-]+/g, ' ')
          .slice(0, 38);

        out.push({
          url: info.thumburl || info.url,
          fallbackUrl: info.url,
          title: cleanTitle,
          source: 'Classic',
          isFallback: false
        });
      });
      return out;
    }

    function buildFallbackTemplates(catObj) {
      const palettes = [
        { top: '#7c2d12', mid: '#c2410c', bot: '#451a03', symbol: '🕉️', title: catObj.label },
        { top: '#581c87', mid: '#9333ea', bot: '#2e1065', symbol: '🪔', title: 'Divine Blessings' },
        { top: '#991b1b', mid: '#dc2626', bot: '#450a0a', symbol: '🚩', title: 'Jai Shri Ram' },
        { top: '#065f46', mid: '#059669', bot: '#022c22', symbol: '🪷', title: 'Suprabhat' }
      ];
      return palettes.map(p => ({
        isFallback: true,
        palette: p,
        title: p.title,
        source: 'Built-in'
      }));
    }

    // ==========================================
    // 5. HTML5 CANVAS COMPOSITING & WHATSAPP SHARE
    // ==========================================
    function renderPhotoCard(photo, index) {
      const container = document.getElementById('cardsContainer');

      const card = document.createElement('div');
      card.className = 'bg-white rounded-3xl shadow-md border border-amber-200/80 overflow-hidden flex flex-col';

      const canvasWrap = document.createElement('div');
      canvasWrap.className = 'relative w-full aspect-[9/16] bg-amber-950 flex items-center justify-center overflow-hidden';

      const canvas = document.createElement('canvas');
      canvas.id = `statusCanvas_${index}`;
      canvas.width = 1080;
      canvas.height = 1920;
      canvas.className = 'w-full h-full object-cover';

      canvasWrap.appendChild(canvas);

      const footer = document.createElement('div');
      footer.className = 'p-3.5 bg-white flex flex-col gap-2';

      const titleRow = document.createElement('div');
      titleRow.className = 'flex items-center justify-between text-xs text-stone-500 px-1';
      titleRow.innerHTML = `<span class="font-semibold text-stone-700 truncate">${escapeHtml(photo.title)}</span><span class="text-[10px] uppercase tracking-wider bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full font-bold">${photo.source}</span>`;

      const shareBtn = document.createElement('button');
      shareBtn.className = 'w-full bg-[#25D366] hover:bg-[#1ebe5d] active:scale-98 transition text-white font-extrabold text-base py-3.5 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2.5';
      shareBtn.innerHTML = `
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/></svg>
        <span>Share to WhatsApp</span>
      `;
      shareBtn.onclick = () => shareCanvasToWhatsApp(canvas, photo.title);

      footer.appendChild(titleRow);
      footer.appendChild(shareBtn);
      card.appendChild(canvasWrap);
      card.appendChild(footer);
      container.appendChild(card);

      drawStatusOnCanvas(canvas, photo);
    }

    function redrawAllCanvases() {
      state.photos.forEach((photo, idx) => {
        const canvas = document.getElementById(`statusCanvas_${idx}`);
        if (canvas) drawStatusOnCanvas(canvas, photo);
      });
    }

    function drawStatusOnCanvas(canvas, photo) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      drawFallbackArtwork(ctx, W, H, photo.palette || { top: '#7c2d12', mid: '#b45309', bot: '#290d04', symbol: '🕉️' });
      drawOverlayFrameAndStamp(ctx, W, H);

      if (photo.isFallback || !photo.url) return;

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const targetRatio = W / H;
        const imgRatio = img.width / img.height;
        let sx = 0, sy = 0, sw = img.width, sh = img.height;

        if (imgRatio > targetRatio) {
          sw = img.height * targetRatio;
          sx = (img.width - sw) / 2;
        } else {
          sh = img.width / targetRatio;
          sy = (img.height - sh) / 2;
        }

        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
        drawOverlayFrameAndStamp(ctx, W, H);
      };
      img.onerror = () => {
        if (photo.fallbackUrl && img.src !== photo.fallbackUrl) {
          img.src = photo.fallbackUrl;
        }
      };
      img.src = photo.url;
    }

    function drawFallbackArtwork(ctx, W, H, palette) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, palette.top);
      grad.addColorStop(0.5, palette.mid);
      grad.addColorStop(1, palette.bot);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const radial = ctx.createRadialGradient(W / 2, H * 0.38, 40, W / 2, H * 0.38, 460);
      radial.addColorStop(0, 'rgba(253, 224, 71, 0.45)');
      radial.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, W, H);

      ctx.font = '240px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(palette.symbol || '🕉️', W / 2, H * 0.38);
    }

    function drawOverlayFrameAndStamp(ctx, W, H) {
      const topGrad = ctx.createLinearGradient(0, 0, 0, 320);
      topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
      topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, W, 320);

      const botGrad = ctx.createLinearGradient(0, H - 620, 0, H);
      botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      botGrad.addColorStop(0.45, 'rgba(15, 5, 0, 0.78)');
      botGrad.addColorStop(1, 'rgba(10, 3, 0, 0.94)');
      ctx.fillStyle = botGrad;
      ctx.fillRect(0, H - 620, W, 620);

      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 10;
      ctx.strokeRect(36, 36, W - 72, H - 72);

      ctx.strokeStyle = 'rgba(253, 230, 138, 0.55)';
      ctx.lineWidth = 3;
      ctx.strokeRect(54, 54, W - 108, H - 108);

      const blessingText = state.subtitle || getActiveCategoryObj().subtitle;
      ctx.fillStyle = '#fde68a';
      ctx.font = '700 44px Cinzel, serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = 12;
      ctx.fillText(blessingText, W / 2, 135);
      ctx.shadowBlur = 0;

      const displayName = state.name || 'Your Name Here';
      const centerX = W / 2;
      const avatarY = H - 320;
      const radius = 115;

      ctx.beginPath();
      ctx.arc(centerX, avatarY, radius + 12, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(centerX, avatarY, radius + 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      if (state.avatarDataUrl) {
        const avatarImg = new Image();
        avatarImg.onload = () => {
          ctx.save();
          ctx.beginPath();
          ctx.arc(centerX, avatarY, radius, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(avatarImg, centerX - radius, avatarY - radius, radius * 2, radius * 2);
          ctx.restore();
          drawNamePlate(ctx, W, H, displayName);
        };
        avatarImg.src = state.avatarDataUrl;
      } else {
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, avatarY, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#78350f';
        ctx.fill();
        ctx.font = '100px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🙏', centerX, avatarY + 6);
        ctx.restore();
        drawNamePlate(ctx, W, H, displayName);
      }
    }

    function drawNamePlate(ctx, W, H, displayName) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 58px "Plus Jakarta Sans", sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 14;
      ctx.fillText(displayName, W / 2, H - 135);

      ctx.fillStyle = '#fcd34d';
      ctx.font = '600 32px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('🙏 Warm Wishes & Blessings 🙏', W / 2, H - 82);
      ctx.shadowBlur = 0;
    }

    function handleCustomBgUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const customPhoto = {
          url: e.target.result,
          title: 'My Custom Photo',
          source: 'Gallery',
          isFallback: false
        };
        state.photos.unshift(customPhoto);
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        state.photos.forEach((p, idx) => renderPhotoCard(p, idx));
      };
      reader.readAsDataURL(file);
    }

    async function shareCanvasToWhatsApp(canvas, title) {
      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
        const fileName = `bhakti-status-${Date.now()}.jpg`;
        const file = new File([blob], fileName, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: title || 'Bhakti Status',
            text: state.subtitle || '🙏'
          });
        } else {
          const link = document.createElement('a');
          link.download = fileName;
          link.href = canvas.toDataURL('image/jpeg', 0.92);
          link.click();
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          alert('Image downloaded! Open WhatsApp Status and select it from your gallery.');
        }
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
